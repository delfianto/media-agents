[build-system]
requires = ["uv_build>=0.9.30,<0.13.0"]
build-backend = "uv_build"

[project]
name = "psammophis"
version = "0.1.0"
description = "Self-hosted Plex media library maintenance toolkit"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "guessit",
    "rich",
]

[project.scripts]
psammophis = "psammophis.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "basedpyright",
]

[tool.uv.build-backend]
module-root = "src"
module-name = "psammophis"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E402"]

[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
